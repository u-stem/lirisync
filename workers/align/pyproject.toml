[project]
name = "lirisync-worker"
version = "0.1.0"
description = "Lirisync alignment worker: speaks a line-delimited JSON protocol over stdio."
# Lower bound: onnxruntime(-gpu) Windows wheels start at cp311, and recent av
# (a faster-whisper dependency) requires 3.12. Upper bound: onnxruntime(-gpu)
# Windows wheels stop at cp314 (checked on PyPI); raise it once they ship newer.
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.5,<3",
  "onnxruntime>=1.31,<2",
  "pydantic>=2.12,<3",
  "sudachidict-core>=20261015",
  "sudachipy>=0.7,<0.8",
]

[project.scripts]
lirisync-worker = "lirisync_worker.__main__:main"

[dependency-groups]
dev = [
  "jsonschema>=4.26,<5",
  "mypy>=2.4,<3",
  "packaging>=26.3,<27",
  "pytest>=9.2,<10",
  "types-jsonschema>=4.26,<5",
  "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "PL", "T20", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# The worker must never write to the protocol channel via print; the one
# test-only noise hook is the single sanctioned exception.
"src/lirisync_worker/__main__.py" = ["T201"]
# Command-line developer tools report on stdout/stderr.
"tools/**" = ["T201"]
# Normalization tests feed full-width and look-alike characters on purpose.
"tests/small/test_match_text.py" = ["RUF001"]
"tests/small/test_ctc_tokens.py" = ["RUF001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]
python_version = "3.12"

# sudachipy ships sudachipy.pyi but no py.typed marker; read its stub instead
# of treating the module as Any. Its __init__ re-exports the stub's names with
# plain `from .sudachipy import ...`, which strict mode does not count as export.
[[tool.mypy.overrides]]
module = ["sudachipy", "sudachipy.*"]
follow_untyped_imports = true
implicit_reexport = true

# onnxruntime ships no py.typed marker; read its sources so the session
# class is typed instead of Any. Its __init__ re-exports with plain imports.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
follow_untyped_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"
